<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение 🌷</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
text-align:center;
}

.envelope{
width:300px;
height:200px;
background:#ff6b81;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
font-size:20px;
}

.card{
display:none;
background:rgba(0,0,0,0.5);
padding:35px;
border-radius:20px;
max-width:500px;
}

button{
margin:8px;
padding:12px 20px;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.yes{
background:white;
color:#ff4b6e;
}

.no{
background:#333;
color:white;
}

textarea{
width:100%;
margin-top:10px;
padding:10px;
border-radius:10px;
border:none;
}

</style>
</head>

<body>

<div class="envelope" onclick="openInvite()">
💌 Ашуға басыңыз
</div>

<div class="card" id="invite">

<h1>🌷 Құрметті арулар 🌷</h1>

<p>
Сіздерді 8 наурыз мерекесімен құттықтаймыз!
</p>

<p>
Сыныптың жігіттері сіздерді  
<b>«Мирас» ресторанына</b>  
мерекелік кешке шақырады.
</p>

<p>
📅 Күні: 11.03.2026  
<br>
⏰ Уақыты: 17:30
</p>

<p>Келесіз бе?</p>

<button class="yes" onclick="yes()">Мен барамын</button>

<button class="no" onclick="showReason()">Мен бармаймын</button>

<div id="reasonBox" style="display:none">

<p>Неге?</p>

<textarea id="message" placeholder="Жауап жазыңыз..."></textarea>

<button onclick="send()">Жіберу</button>

</div>

</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a9e9f0f2.mp3">
</audio>

<script>

function openInvite(){

document.querySelector(".envelope").style.display="none"
document.getElementById("invite").style.display="block"
document.getElementById("music").play()

}

function yes(){

alert("Керемет! Біз сізді күтеміз 🌷")

}

function showReason(){

document.getElementById("reasonBox").style.display="block"

}

function send(){

let text=document.getElementById("message").value

let token="7842244275:AAHPSdRJA5ihRUgXueXg3W0uKHV-W3QkvRA"
let chat="2071572237"

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

chat_id:chat,

text:"Жауап: "+text

})

})

alert("Жауабыңыз жіберілді")

}

</script>

</body>
</html>
