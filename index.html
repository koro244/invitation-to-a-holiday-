<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>8 наурызға шақыру | Батыр мейрамханасы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Playfair Display', 'Georgia', serif;
        }

        body {
            background: linear-gradient(145deg, #fbe9f0 0%, #f8dbe7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ПАДАЮЩИЕ ЛЕПЕСТКИ ===== */
        .petal {
            position: fixed;
            top: -10%;
            color: #ffb7c5;
            font-size: 20px;
            opacity: 0.6;
            animation: fall linear infinite;
            z-index: 5;
            pointer-events: none;
            user-select: none;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.2; }
        }

        /* ===== КОНФЕТТИ ===== */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffb6c1;
            border-radius: 50%;
            top: -10%;
            z-index: 9999;
            animation: confettiFall 3s ease-out forwards;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 250, 245, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 50px 50px 40px 40px;
            box-shadow: 0 30px 60px -15px rgba(199, 120, 150, 0.4), 
                        0 0 0 2px rgba(255, 220, 235, 0.8) inset;
            overflow: hidden;
            position: relative;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .decor-stripe {
            height: 12px;
            background: linear-gradient(90deg, #ffcad4, #fdd1d9, #fee3e8, #ffd9e2, #ffcad4);
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 18px;
            color: #e49ab0;
            letter-spacing: 8px;
        }

        /* ===== ЭКРАН ВВОДА ИМЕНИ ===== */
        .name-screen {
            padding: 50px 24px 60px;
            text-align: center;
            background: #fff9fc;
            transition: all 0.5s ease;
        }

        .name-screen.hidden {
            display: none;
        }

        .flowers-big {
            font-size: 70px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .flowers-big span {
            display: inline-block;
            transition: transform 0.3s ease;
            cursor: default;
        }

        /* Тактильность: цветы двигаются при наведении */
        .flowers-big span:hover {
            transform: scale(1.2) rotate(5deg);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .greeting-title {
            font-size: 38px;
            font-weight: 500;
            color: #b1546c;
            text-shadow: 2px 2px 0 #ffd9e2;
            margin-bottom: 30px;
            font-family: 'Playfair Display', serif;
        }

        .name-input-wrapper {
            margin: 30px 0;
            position: relative;
        }

        .name-input {
            width: 100%;
            padding: 18px 25px;
            font-size: 20px;
            border: 3px solid #ffd0da;
            border-radius: 60px;
            background: white;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }

        .name-input:focus {
            border-color: #f28aa8;
            box-shadow: 0 0 0 5px rgba(242, 138, 168, 0.2);
            transform: scale(1.02);
        }

        .enter-btn {
            background: #fec5d0;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
            color: #9f4d62;
            box-shadow: 0 8px 0 #de8da0;
            cursor: pointer;
            transition: 0.1s ease;
            border: 2px solid white;
            margin-top: 20px;
            width: 100%;
            letter-spacing: 2px;
        }

        /* Тактильность: кнопка пружинит */
        .enter-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #de8da0;
        }

        .enter-btn:hover {
            background: #ffb7c9;
        }

        .hint-text {
            font-size: 18px;
            color: #c48a9b;
            margin-top: 25px;
            font-style: italic;
        }

        /* ===== ПЕРСОНАЛЬНАЯ ОТКРЫТКА ===== */
        .personal-card {
            padding: 40px 24px 30px;
            text-align: center;
            background: #fff0f5;
            display: none;
            border-bottom: 2px dashed #ffc1d0;
        }

        .personal-card.show {
            display: block;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .personal-name {
            font-size: 42px;
            font-weight: 700;
            color: #b83b62;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #ffd9e2;
        }

        .personal-message {
            font-size: 20px;
            line-height: 1.6;
            color: #973f5c;
            background: white;
            padding: 25px;
            border-radius: 40px;
            margin: 15px 0;
            border: 2px solid #ffb8ca;
            box-shadow: 0 8px 0 #fbaac0;
            text-align: left;
            font-style: italic;
            white-space: pre-line;
            position: relative;
        }

        /* Анимация печатающегося текста */
        .typing {
            overflow: hidden;
            border-right: 3px solid #ff8da1;
            white-space: pre-line;
            animation: typing 2.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { max-height: 0; opacity: 0; }
            to { max-height: 500px; opacity: 1; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #ff8da1; }
        }

        .heart-animation {
            font-size: 40px;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin: 10px 0;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .continue-btn {
            background: #fec5d0;
            border: none;
            padding: 16px 30px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 600;
            color: #9f4d62;
            box-shadow: 0 6px 0 #de8da0;
            cursor: pointer;
            transition: 0.1s ease;
            border: 2px solid white;
            margin: 20px 0;
        }

        .continue-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #de8da0;
        }

        /* ===== ОСНОВНОЕ ПРИГЛАШЕНИЕ ===== */
        .invitation-content {
            padding: 32px 24px 36px;
            background: #fff9fc;
            display: none;
        }

        .invitation-content.show {
            display: block;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .restaurant-name {
            text-align: center;
            font-size: 42px;
            font-weight: 500;
            letter-spacing: 6px;
            color: #b1546c;
            font-family: 'Times New Roman', serif;
            text-shadow: 2px 2px 0 #ffd9e2;
        }

        .restaurant-name span {
            font-size: 18px;
            display: block;
            letter-spacing: 4px;
            color: #d46b8d;
        }

        .invite-title {
            text-align: center;
            font-size: 26px;
            color: #b65774;
            border-top: 2px dashed #ffc1cc;
            border-bottom: 2px dashed #ffc1cc;
            padding: 16px 0;
            margin: 24px 0;
            background: #fff2f7;
            border-radius: 100px;
        }

        .details {
            background: #fff2f7;
            border-radius: 60px;
            padding: 26px 20px;
            margin: 20px 0;
            border: 2px solid #ffd9e2;
            box-shadow: 0 12px 18px -10px #e8b7c5;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #ffd0da;
            transition: transform 0.2s;
        }

        /* Тактильность: детали слегка поднимаются */
        .detail-item:hover {
            transform: translateX(5px);
        }

        .detail-icon {
            font-size: 36px;
            width: 54px;
            text-align: center;
        }

        .detail-value {
            font-size: 22px;
            font-weight: 600;
            color: #973f5c;
        }

        .rsvp-form {
            background: #fff2f7;
            border-radius: 40px;
            padding: 24px 18px;
            margin: 24px 0;
            border: 2px solid #ffd0da;
        }

        .form-input {
            width: 100%;
            padding: 16px 22px;
            font-size: 18px;
            border: 3px solid #ffd0da;
            border-radius: 60px;
            background: white;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #f59bb3;
            transform: scale(1.02);
        }

        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .radio-option {
            flex: 1;
            min-width: 100px;
            background: white;
            border: 3px solid #ffd0da;
            border-radius: 60px;
            padding: 14px 6px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #a04c68;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #f3bacb;
        }

        /* Тактильность: радио кнопки */
        .radio-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #f3bacb;
            background: #ffe5ec;
        }

        .radio-option.selected {
            background: #fec5d6;
            border-color: #f28aa8;
            box-shadow: 0 6px 0 #de7b9b;
            transform: translateY(-2px);
        }

        .radio-option:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #f3bacb;
        }

        .radio-option input {
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 18px 12px;
            border: none;
            border-radius: 60px;
            font-size: 24px;
            font-weight: 700;
            background: #ffb3c6;
            color: #7e374f;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 7px 0 #db7b99;
            border: 3px solid white;
            margin: 16px 0;
        }

        .submit-btn:active {
            transform: translateY(7px);
            box-shadow: 0 0 0 #db7b99;
        }

        .submit-btn:hover {
            background: #ffa5bb;
        }

        #formMessage {
            text-align: center;
            font-size: 18px;
            margin-top: 16px;
            padding: 12px;
            border-radius: 60px;
        }

        .signature {
            font-family: 'Brush Script MT', cursive;
            font-size: 42px;
            color: #bc5679;
            text-align: center;
            margin-top: 20px;
            text-shadow: 2px 2px 0 #ffd9e2;
        }
    </style>
</head>

            'Сезім': 'Сезім — сезімге толы, жүрегі жылы! Өзіңнің мейірімділігіңмен бәрімізді баурап алдың. Көктемнің шуағындай болып, әр күнің қуанышпен толсын! 🌷',
            
            'Жанель': 'Жанель — әдемі әрі сүйкімді! Есіміңнің әуезділігі сияқты өзің де жаныңдағыларға жарық сыйлайсың. Мерекең құтты болсын, армандарың орындала берсін! 🌺',
            
            'Мика': 'Микаа — кішкентай бүлдіршіндей сүйкімді! Атыңның өзі әдемі әуендей естіледі. Көктемнің шуағындай жарқырап, әр күнің қуанышқа толы болсын! 💮',
            
            'Фарида': 'Фарида — ақылды, әдепті, өнерлі! Әрқашан алға ұмтылып, биіктерден көріне бер. Көктем мерекесінде барлық жақсылықтар сенің жолыңда болсын! 💐',
            
            'Марфуға': 'Марфуға — атыңдай асылсың! Жылы жүрегің, мейірімді көзқарасың бәрімізге үлгі. Көктемнің шуағындай жарқырап, әр сәтің бақытқа толсын! 🌼',
            
            'Айғаным': 'Айғаным — айдай сұлу, ақылды! Есіміңнің өзі ай мен күндей жарық. Әрқашан осындай нәзік әрі сүйкімді болып қала бер! 🌸',
            
            'Малика': 'Малика — ханшайым атың лайықты жан! Салтанатың мен сұлулығың бәрімізді баурап алады. Көктем мерекесінде барлық армандарың орындалсын! 🌷'
        };

        // Элементы
        const nameScreen = document.getElementById('nameScreen');
        const personalCard = document.getElementById('personalCard');
        const invitationContent = document.getElementById('invitationContent');
        const nameInput = document.getElementById('nameInput');
        const enterBtn = document.getElementById('enterBtn');
        const continueBtn = document.getElementById('continueBtn');
        const personalName = document.getElementById('personalName');
        const personalMessage = document.getElementById('personalMessage');
        const rsvpName = document.getElementById('rsvpName');
        const submitBtn = document.getElementById('submitRsvp');
        const formMessage = document.getElementById('formMessage');
        const radioOptions = document.querySelectorAll('.radio-option');
        const radioInputs = document.querySelectorAll('input[name="rsvp"]');

        let currentName = '';
        let selectedValue = '';

        // Обработка ввода имени
        enterBtn.addEventListener('click', function() {
            const name = nameInput.value.trim();
            
            if (personalMessages[name]) {
                currentName = name;
                personalName.textContent = name;
                personalMessage.textContent = personalMessages[name];
                personalMessage.classList.add('typing');
                
                nameScreen.style.display = 'none';
                personalCard.classList.add('show');
            } else {
                alert('❌ Атыңыз тізімде жоқ. Тек қана шақырылған қыздар!');
            }
        });

        // Enter также работает
        nameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enterBtn.click();
            }
        });

        // Переход к приглашению
        continueBtn.addEventListener('click', function() {
            personalCard.style.display = 'none';
            invitationContent.classList.add('show');
            rsvpName.value = currentName; // Автоматически подставляем имя
        });

        // ===== КОНФЕТТИ =====
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = `hsl(${Math.random() * 60 + 330}, 80%, 70%)`;
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // ===== RSVP (радио кнопки) =====
        radioOptions.forEach(option => {
            option.addEventListener('click', function() {
                const radio = this.querySelector('input');
                if (radio) {
                    radio.checked = true;
                    radioOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedValue = radio.value;
                }
            });
        });

        radioInputs.forEach(input => {
            input.addEventListener('change', function() {
                radioOptions.forEach(opt => opt.classList.remove('selected'));
                const parent = this.closest('.radio-option');
                if (parent) parent.classList.add('selected');
                selectedValue = this.value;
            });
        });

        // Отправка в Telegram
        async function sendToTelegram(name, status) {
            const message = `🌸 8 НАУРЫЗҒА ШАҚЫРУҒА ЖАУАП\n\n👤 Есімі: ${name}\n📌 Жауабы: ${status}\n\n🗓 Батыр мейрамханасы | 11.03.2026 17:30`;
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message })
                });
                const data = await response.json();
                return data.ok;
            } catch (error) {
                return false;
            }
        }

        submitBtn.addEventListener('click', async function() {
            const name = rsvpName.value.trim();
            if (!name) {
                formMessage.textContent = '✏️ Атыңызды жазыңыз';
                formMessage.style.background = '#ffe2e9';
                return;
            }

            let status = selectedValue;
            if (!status) {
                const checked = document.querySelector('input[name="rsvp"]:checked');
                if (checked) status = checked.value;
            }

            if (!status) {
                formMessage.textContent = '❓ Жауап таңдаңыз';
                formMessage.style.background = '#ffe2e9';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Жіберілуде...';

            const success = await sendToTelegram(name, status);

            if (success) {
                formMessage.textContent = '✅ Рахмет! Жауабыңыз жіберілді';
                formMessage.style.background = '#d9f0e1';
                createConfetti(); // 🎉 КОНФЕТТИ!!!
                
                // Сброс формы
                rsvpName.value = currentName;
                radioOptions.forEach(opt => opt.classList.remove('selected'));
                radioInputs.forEach(input => input.checked = false);
                selectedValue = '';
            } else {
                formMessage.textContent = '❌ Қате шықты. Қайталаңыз';
                formMessage.style.background = '#ffe2e9';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '📨 Жауап беру';
        });

    })();
</script>

</body>
</html>
